[project]
name = "cityshift"
version = "0.1.0"
description = "CITY//SHIFT backend: SUMO-backed finite-fleet transportation scenario laboratory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pymongo==4.14.1",
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "elasticsearch>=9.0",
    "openjiuwen==0.1.18",
    "sentry-sdk[fastapi]>=2.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "mongomock==4.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cityshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"
